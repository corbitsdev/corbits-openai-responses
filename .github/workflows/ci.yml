name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: node consumer smoke
        run: |
          set -euo pipefail
          TARBALL="$PWD/$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/c" && cd "$RUNNER_TEMP/c"
          npm init -y >/dev/null && npm pkg set type=module >/dev/null
          npm install "$TARBALL"
          node -e 'import("@corbits/openai-responses").then((m) => { for (const n of ["createOpenAIResponsesAdapter", "responsesAdapterFactory"]) if (typeof m[n] !== "function") throw new Error("missing export: " + n); })'
